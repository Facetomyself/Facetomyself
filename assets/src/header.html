<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0b0d12;width:1200px;height:360px;overflow:hidden}
canvas{position:absolute;inset:0}
.t{position:absolute;left:84px;top:118px;color:#e8ecf2;font:600 64px/1 "Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:-1.5px}
.s{position:absolute;left:88px;top:204px;color:#8b95a7;font:400 21px/1.4 "Noto Sans CJK SC","Noto Sans SC",sans-serif;letter-spacing:3px}
.m{position:absolute;left:88px;top:250px;color:#5d6778;font:400 13px/1 "DejaVu Sans Mono",monospace;letter-spacing:2px}
</style></head><body><canvas id=c width=1200 height=360></canvas>
<div class=t>Facetomyself</div><div class=s>逆向工程 · Reverse Engineering</div><div class=m>FRIDA / IDA / V8 / AST / MCP</div>
<script>
const gl=document.getElementById('c').getContext('webgl',{preserveDrawingBuffer:true});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs=`precision highp float;uniform float T;uniform vec2 R;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec2 uv=gl_FragCoord.xy/R;vec2 p=uv*vec2(R.x/R.y,1.);
float a=6.2831853*T;vec3 col=vec3(.043,.051,.071);
// flowing contour lines (loop-periodic)
float f=0.;
for(int i=0;i<4;i++){float k=float(i)+1.;
 f+=sin(p.x*1.7*k+p.y*2.3+cos(a*k)*1.2+sin(a+p.y*3.)*.6)/k;}
f+=.9*sin(p.y*4.+p.x*.8+sin(a)*1.5);
float lines=abs(fract(f*2.2)-.5);float ln=smoothstep(.06,.0,lines);
float mask=smoothstep(.2,1.,uv.x)*(.55+.45*uv.y);
vec3 c1=vec3(.36,.48,.95),c2=vec3(.29,.85,.78);
col+=mix(c1,c2,uv.x+.2*sin(a+f))*ln*.42*mask;
// faint byte grid stream on the right
vec2 g=floor(p*vec2(30.,18.));float sp=h(vec2(g.x,0.))*3.+1.;
float row=g.y+floor(mod(T*18.*sp,18.));float on=step(.82,h(vec2(g.x,row)));
vec2 fp=fract(p*vec2(30.,18.));float cell=step(.25,fp.x)*step(fp.x,.7)*step(.35,fp.y)*step(fp.y,.55);
col+=vec3(.45,.6,.9)*on*cell*.18*smoothstep(.55,1.,uv.x);
// vignette
col*=1.-.35*length(uv-vec2(.6,.5));
gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),1200,360);
window.draw=t=>{gl.uniform1f(gl.getUniformLocation(pr,'T'),t);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();return true};
draw(0);
</script></body></html>
